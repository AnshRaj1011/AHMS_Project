server.port=8080
server.servlet.context-path=/api

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/ahms_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# JWT
jwt.secret=ahms_super_secret_key_min_256_bits_change_in_production_2024
jwt.expiration=86400000

# Python microservices
python.qr-service.url=http://localhost:5001
python.chatbot-service.url=http://localhost:5002

# File storage
app.upload.dir=uploads/qr-codes

# Logging
logging.level.com.ahms=INFO

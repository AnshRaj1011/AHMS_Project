<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AHMS – Login</title>
  <link rel="stylesheet" href="../css/style.css"/>
</head>
<body class="auth-page">

<div class="auth-card">
  <div class="auth-logo">
    <span class="logo-icon">🏥</span>
    <h1>AHMS</h1>
    <p>Advanced Hospital Management System</p>
  </div>

  <div class="tab-row">
    <button class="tab-btn active" onclick="switchTab('login')">Login</button>
    <button class="tab-btn" onclick="switchTab('register')">Register</button>
  </div>

  <!-- LOGIN FORM -->
  <form id="loginForm" class="auth-form" onsubmit="doLogin(event)">
    <div class="form-group">
      <label>Username</label>
      <input type="text" id="loginUsername" placeholder="Enter username" required/>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="loginPassword" placeholder="Enter password" required/>
    </div>
    <button type="submit" class="btn-primary" id="loginBtn">Login</button>
    <p id="loginError" class="error-msg"></p>
  </form>

  <!-- REGISTER FORM -->
  <form id="registerForm" class="auth-form hidden" onsubmit="doRegister(event)">
    <div class="form-group">
      <label>Full Name</label>
      <input type="text" id="regName" placeholder="Your full name" required/>
    </div>
    <div class="form-group">
      <label>Username</label>
      <input type="text" id="regUsername" placeholder="Choose a username" required/>
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="regEmail" placeholder="Email address" required/>
    </div>
    <div class="form-group">
      <label>Phone</label>
      <input type="tel" id="regPhone" placeholder="Phone number"/>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="regPassword" placeholder="Min 6 characters" required minlength="6"/>
    </div>
    <div class="form-group">
      <label>Register As</label>
      <select id="regRole">
        <option value="PATIENT">Patient</option>
        <option value="DOCTOR">Doctor</option>
      </select>
    </div>
    <button type="submit" class="btn-primary" id="regBtn">Register</button>
    <p id="regError" class="error-msg"></p>
    <p id="regSuccess" class="success-msg"></p>
  </form>
</div>

<script src="../js/api.js"></script>
<script>
  function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    document.getElementById('loginForm').classList.toggle('hidden', tab !== 'login');
    document.getElementById('registerForm').classList.toggle('hidden', tab !== 'register');
  }

  async function doLogin(e) {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    btn.textContent = 'Logging in...'; btn.disabled = true;
    try {
      const res = await api.post('/auth/login', {
        username: document.getElementById('loginUsername').value,
        password: document.getElementById('loginPassword').value
      });
      const { token, role, userId, fullName } = res.data;
      localStorage.setItem('token', token);
      localStorage.setItem('role', role);
      localStorage.setItem('userId', userId);
      localStorage.setItem('fullName', fullName);
      window.location.href = role === 'ADMIN' ? 'admin.html' : 'dashboard.html';
    } catch (err) {
      document.getElementById('loginError').textContent = err.message || 'Login failed';
    } finally { btn.textContent = 'Login'; btn.disabled = false; }
  }

  async function doRegister(e) {
    e.preventDefault();
    const btn = document.getElementById('regBtn');
    btn.textContent = 'Registering...'; btn.disabled = true;
    document.getElementById('regError').textContent = '';
    document.getElementById('regSuccess').textContent = '';
    try {
      await api.post('/auth/register', {
        username: document.getElementById('regUsername').value,
        password: document.getElementById('regPassword').value,
        email: document.getElementById('regEmail').value,
        fullName: document.getElementById('regName').value,
        phoneNumber: document.getElementById('regPhone').value,
        role: document.getElementById('regRole').value
      });
      document.getElementById('regSuccess').textContent = 'Registered! Please login.';
      document.getElementById('registerForm').reset();
    } catch (err) {
      document.getElementById('regError').textContent = err.message || 'Registration failed';
    } finally { btn.textContent = 'Register'; btn.disabled = false; }
  }

  // Redirect if already logged in
  if (localStorage.getItem('token')) {
    window.location.href = localStorage.getItem('role') === 'ADMIN' ? 'admin.html' : 'dashboard.html';
  }
</script>
</body>
</html>
